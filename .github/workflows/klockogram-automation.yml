name: Klockogram automation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: klockogram-production-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Reconcile payments, shipping and transactional emails
        env:
          KLOCKOGRAM_AUTOMATION_SECRET: ${{ secrets.KLOCKOGRAM_AUTOMATION_SECRET }}
          KLOCKOGRAM_APP_URL: https://klockogram.pl
        run: |
          set -euo pipefail
          if [ -z "${KLOCKOGRAM_AUTOMATION_SECRET:-}" ]; then
            echo "Repository secret KLOCKOGRAM_AUTOMATION_SECRET is missing."
            exit 1
          fi
          for endpoint in reconcile shipping emails; do
            curl --fail-with-body --silent --show-error \
              --retry 2 --retry-all-errors --max-time 45 \
              -X POST \
              -H "Authorization: Bearer ${KLOCKOGRAM_AUTOMATION_SECRET}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              "${KLOCKOGRAM_APP_URL}/api/cron/${endpoint}"
            echo
          done
